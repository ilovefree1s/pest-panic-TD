<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Collar Painter</title>
<style>
  html,body{margin:0;height:100%;background:#1c2028;color:#eee;font:15px/1.3 system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(12,14,18,.9);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:700 15px system-ui;padding:10px 14px;border-radius:10px;border:1px solid #444;background:#2a2f38;color:#eee}
  button.on{background:#ffc23a;color:#000;border-color:#ffc23a}
  label{display:flex;gap:6px;align-items:center;font-size:13px}
  input[type=range]{width:110px}
  #msg{position:fixed;top:8px;left:8px;right:8px;text-align:center;font-size:13px;opacity:.8;pointer-events:none}
  #msg b{color:#ffc23a}
</style></head><body>
<div id="msg">Loading…</div>
<svg id="lasso" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none"><polyline fill="rgba(255,194,58,.18)" stroke="#ffc23a" stroke-width="3" stroke-dasharray="8 6" points=""/></svg>
<div id="ui">
  <button id="mOrbit" class="on">Rotate / zoom</button>
  <button id="mPaint">Paint collar</button>
  <button id="mErase">Erase</button>
  <button id="mLasso">Outline → paint</button>
  <button id="mLassoE">Outline → erase</button>
  <label>Brush <input type="range" id="brush" min="1" max="12" value="4"></label>
  <button id="view">Grey model</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear</button>
  <button id="save">Save mask</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id), msg = t => $('msg').innerHTML = t;
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(R.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#2b3038');
sc.add(new THREE.HemisphereLight('#ffffff', '#556', 1.6)); const dl = new THREE.DirectionalLight('#fff', 2); dl.position.set(-3, 6, 5); sc.add(dl);
const cam = new THREE.PerspectiveCamera(32, 1, 0.01, 100); const ctl = new OrbitControls(cam, R.domElement); ctl.enableDamping = true;
function size() { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); } addEventListener('resize', size); size();
let grey = true, maps = [], faceC = null, faceN = null;
let mesh = null, P = null, N = null, UV = null, I = null, col = null, mark = null, hist = [], mode = 'orbit', W = 0, H = 0;
const KEY = 'ppd-collar-paint';
new GLTFLoader().load('assets/exterminator.glb', g => {
  g.scene.traverse(o => { if (o.isSkinnedMesh && !mesh) mesh = o; });
  mesh.frustumCulled = false; mesh.geometry = mesh.geometry.toNonIndexed(); const geo = mesh.geometry; P = geo.attributes.position;   /* one set of corners per triangle: paint is per face, flat and crisp */ N = geo.attributes.normal; UV = geo.attributes.uv; I = geo.index;
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material]; const img = mats[0].map && mats[0].map.image; W = img ? img.width : 2048; H = img ? img.height : 2048;
  for (const m of mats) { maps.push(m.map); m.vertexColors = true; m.metalness = 0; m.roughness = 0.9; m.emissiveMap = null; m.emissive.set(0); m.needsUpdate = true; }
  applyView();
  col = new Float32Array(P.count * 3).fill(1); geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); mark = new Uint8Array(P.count / 3);   /* per face */
  try { const s = localStorage.getItem(KEY + '2'); if (s) { const a = JSON.parse(s); for (const i of a) if (i < mark.length) mark[i] = 1; } } catch (e) {}

  sc.add(g.scene); g.scene.updateMatrixWorld(true); mesh.skeleton.update();
  faceC = new Float32Array(mark.length * 3); faceN = new Float32Array(mark.length * 3); const c3 = new THREE.Vector3(), n3 = new THREE.Vector3(), tmp = new THREE.Vector3();
  for (let f = 0; f < mark.length; f++) { c3.set(0, 0, 0); n3.set(0, 0, 0); for (let j = 0; j < 3; j++) { mesh.getVertexPosition(f * 3 + j, tmp); c3.add(tmp); n3.add(tmp.fromBufferAttribute(N, f * 3 + j)); } c3.divideScalar(3).applyMatrix4(mesh.matrixWorld); n3.normalize().transformDirection(mesh.matrixWorld); faceC.set([c3.x, c3.y, c3.z], f * 3); faceN.set([n3.x, n3.y, n3.z], f * 3); }
  tint();
  const bb = new THREE.Box3().setFromObject(g.scene), c = bb.getCenter(new THREE.Vector3()), h = bb.max.y - bb.min.y;
  ctl.target.set(c.x, bb.min.y + h * 0.78, c.z); cam.position.set(c.x, bb.min.y + h * 0.9, c.z + h * 1.6); ctl.update();
  msg('<b>Rotate / zoom</b> with one finger / pinch. <b>Outline → paint</b>: trace a loop around the collar and everything inside it is painted (do the front, then spin round for the back). Brush and Erase for touch-ups. <b>Save mask</b> when done and send me the file.');
});
function applyView() { const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material]; mats.forEach((m, k) => { m.map = grey ? null : maps[k]; m.needsUpdate = true; }); $('view').textContent = grey ? 'Show texture' : 'Grey model'; if (mark) tint(); }
function tint() { for (let f = 0; f < mark.length; f++) { const m = mark[f]; for (let j = 0; j < 3; j++) { const i = f * 3 + j; if (grey) { col[i * 3] = m ? 1 : 0.72; col[i * 3 + 1] = m ? 0.5 : 0.74; col[i * 3 + 2] = m ? 0.08 : 0.78; } else { col[i * 3] = 1; col[i * 3 + 1] = m ? 0.25 : 1; col[i * 3 + 2] = m ? 0.25 : 1; } } } mesh.geometry.attributes.color.needsUpdate = true; try { const a = []; for (let i = 0; i < mark.length; i++) if (mark[i]) a.push(i); localStorage.setItem(KEY + '2', JSON.stringify(a)); } catch (e) {} }
const ray = new THREE.Raycaster(), v = new THREE.Vector3(), nv = new THREE.Vector3(), cdir = new THREE.Vector3(); let painting = false, stroke = null;
function hitPaint(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight * 2 - 1)), cam); const hs = ray.intersectObject(mesh, false); if (!hs.length) return;
  const hp = hs[0].point, dist = cam.position.distanceTo(hp), r = dist * Math.tan(cam.fov * Math.PI / 360) * 2 / innerHeight * ($('brush').value * 6);   /* brush radius in world units, ~N px on screen */
  cam.getWorldDirection(cdir); const val = mode === 'paint' ? 1 : 0; let changed = false;
  for (let f = 0; f < mark.length; f++) { v.fromArray(faceC, f * 3); if (v.distanceToSquared(hp) > r * r) continue;
    nv.fromArray(faceN, f * 3); if (nv.dot(cdir) > 0.2) continue;   /* only the side facing you: no painting through him */
    if (mark[f] !== val) { if (!stroke.has(f)) stroke.set(f, mark[f]); mark[f] = val; changed = true; } }
  if (changed) tint();
}
const el = R.domElement, poly = $('lasso').firstElementChild; let pts = [];
function inPoly(x, y) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function lassoFill() {   /* everything facing you whose screen position lies inside the loop */
  if (pts.length < 3) return; const val = mode === 'lasso' ? 1 : 0; cam.getWorldDirection(cdir); stroke = new Map(); const sp = new THREE.Vector3();
  for (let f = 0; f < mark.length; f++) { nv.fromArray(faceN, f * 3); if (nv.dot(cdir) > 0.2) continue;
    v.fromArray(faceC, f * 3); sp.copy(v).project(cam); const x = (sp.x + 1) / 2 * innerWidth, y = (1 - sp.y) / 2 * innerHeight; if (sp.z > 1 || !inPoly(x, y)) continue;
    /* hidden behind another part of him? check with a ray */ ray.setFromCamera(new THREE.Vector2(sp.x, sp.y), cam); const hs = ray.intersectObject(mesh, false); if (hs.length && hs[0].faceIndex !== f && hs[0].distance < cam.position.distanceTo(v) - 0.01) continue;
    if (mark[f] !== val) { stroke.set(f, mark[f]); mark[f] = val; } }
  if (stroke.size) { hist.push(stroke); tint(); } stroke = null; }
el.addEventListener('pointerdown', e => { if (mode === 'orbit') return; painting = true; el.setPointerCapture(e.pointerId); if (mode.startsWith('lasso')) { pts = [[e.clientX, e.clientY]]; poly.setAttribute('points', pts.map(q => q.join(',')).join(' ')); return; } stroke = new Map(); hitPaint(e.clientX, e.clientY); });
el.addEventListener('pointermove', e => { if (!painting) return; if (mode.startsWith('lasso')) { pts.push([e.clientX, e.clientY]); poly.setAttribute('points', pts.map(q => q.join(',')).join(' ')); return; } hitPaint(e.clientX, e.clientY); });
el.addEventListener('pointerup', () => { if (!painting) return; painting = false; if (mode.startsWith('lasso')) { lassoFill(); pts = []; poly.setAttribute('points', ''); return; } if (stroke && stroke.size) hist.push(stroke); stroke = null; });
function setMode(m) { mode = m; ctl.enabled = m === 'orbit'; for (const [k, id] of [['orbit', 'mOrbit'], ['paint', 'mPaint'], ['erase', 'mErase'], ['lasso', 'mLasso'], ['lassoE', 'mLassoE']]) $(id).classList.toggle('on', k === m); }
$('mOrbit').onclick = () => setMode('orbit'); $('mPaint').onclick = () => setMode('paint'); $('mErase').onclick = () => setMode('erase'); $('mLasso').onclick = () => setMode('lasso'); $('mLassoE').onclick = () => setMode('lassoE');
$('view').onclick = () => { grey = !grey; applyView(); };
$('undo').onclick = () => { const s = hist.pop(); if (!s) return; for (const [i, val] of s) mark[i] = val; tint(); };
$('clear').onclick = () => { if (!confirm('Clear all paint?')) return; hist.push(new Map([...mark].map((m, i) => [i, m]).filter(([, m]) => m))); mark.fill(0); tint(); };
$('save').onclick = () => {
  /* the mask in texture space: a triangle is collar when all three of its corners are painted (matches how the game reads it) */
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.fillStyle = '#fff';
  let tris = 0;
  for (let f = 0; f < mark.length; f++) { if (!mark[f]) continue; const a = f * 3, b = a + 1, c = a + 2; tris++;
    x.beginPath(); x.moveTo(UV.getX(a) * W, UV.getY(a) * H); x.lineTo(UV.getX(b) * W, UV.getY(b) * H); x.lineTo(UV.getX(c) * W, UV.getY(c) * H); x.closePath(); x.fill(); x.lineWidth = 2; x.strokeStyle = '#fff'; x.stroke(); }
  cv.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'collar_mask.png'; document.body.appendChild(a); a.click(); a.remove(); msg('Saved <b>collar_mask.png</b> (' + tris + ' triangles). Send it to me.'); }, 'image/png');
};
(function loop() { requestAnimationFrame(loop); ctl.update(); R.render(sc, cam); })();
</script></body></html>
