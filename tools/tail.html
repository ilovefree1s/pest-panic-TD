<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centipede tail tool</title>
<style>
body{margin:0;background:#2b3038;color:#eee;font:14px system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
#v{flex:1;min-width:0}
#p{width:300px;padding:14px;box-sizing:border-box;background:#1c2026;overflow:auto}
label{display:block;margin:10px 0 2px;font-weight:700;color:#cfd4da;font-size:12px}
input[type=range]{width:100%}
.row{display:flex;justify-content:space-between;align-items:center}
.row span{font-variant-numeric:tabular-nums;color:#ffcc33}
button{margin-top:14px;width:100%;padding:10px;font:700 15px system-ui;border:0;border-radius:10px;background:#ffcc33;color:#3a2a12;cursor:pointer}
textarea{width:100%;height:90px;margin-top:8px;background:#0f1216;color:#9fe39f;border:1px solid #444;border-radius:8px;font:12px monospace;box-sizing:border-box}
h2{margin:0 0 6px;font-size:16px;color:#ffcc33}
small{color:#999}
@media (max-width:760px){body{flex-direction:column;height:auto;min-height:100vh;overflow:auto} #v{flex:none;height:46vh;position:sticky;top:0;z-index:2;touch-action:none} #p{width:auto;flex:1} #ctl{display:grid;grid-template-columns:1fr 1fr;gap:0 14px} label{margin:6px 0 0;font-size:11px}}
</style></head><body>
<div id="v"></div>
<div id="p">
<h2>Centipede tail</h2>
<small>Drag to orbit, wheel to zoom. Set the round cap and the two tail legs, hit Copy, paste the text to Claude.</small>
<div id="ctl"></div>
<button id="copy">Copy settings</button>
<textarea id="out" readonly></textarea>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const V = document.getElementById('v'), R = new THREE.WebGLRenderer({ antialias: true }); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.setPixelRatio(devicePixelRatio); V.appendChild(R.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#2b3038'); sc.add(new THREE.HemisphereLight('#fff', '#556', 1.6)); const dl = new THREE.DirectionalLight('#fff1dc', 2.2); dl.position.set(-3, 6, 5); sc.add(dl);
const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 100); cam.position.set(-2.4, 1.2, -2.4); const oc = new OrbitControls(cam, R.domElement); oc.target.set(0, 0.25, -0.5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: '#8a6a48' })); floor.rotation.x = -Math.PI / 2; sc.add(floor);
function resize() { R.setSize(V.clientWidth, V.clientHeight); cam.aspect = V.clientWidth / V.clientHeight; cam.updateProjectionMatrix(); } addEventListener('resize', resize); resize();
/* same numbers as the game: ring 0.6 long, tinted (0.6,0.47,0.6), three rings 0.46 apart, the last one wears the tail */
const P = { capR: 0.96, capZ: 0.55, capStretch: 1.35, capY: 0, legLen: 1.6, legR: 0.14, legX: 0.45, legY: -0.1, legZ: 0.6, legSpread: 0.45, legDroop: 0.15, legBend: 0.5, tipLen: 0.5 };
const DEF = [['capR', 'Cap size (× ring radius)', 0.5, 1.4, 0.01], ['capZ', 'Cap centre (0 = at the flat face, + = inside ring)', -0.5, 1.2, 0.01], ['capStretch', 'Cap stretch back', 0.6, 2.2, 0.01], ['capY', 'Cap up/down', -0.4, 0.4, 0.01],
  ['legLen', 'Tail legs length (× r)', 0.3, 4, 0.01], ['legR', 'Tail legs thickness (× r)', 0.04, 0.4, 0.01], ['legX', 'Tail legs apart at the root (× r)', 0, 1.2, 0.01], ['legY', 'Tail legs up/down (× r)', -0.8, 0.8, 0.01], ['legZ', 'Tail legs root back (× r)', -0.5, 2, 0.01],
  ['legSpread', 'Tail legs spread out (rad)', -0.3, 1.5, 0.01], ['legDroop', 'Tail legs droop down (rad)', -0.8, 1.2, 0.01], ['legBend', 'Knee bend (rad)', -1, 1.5, 0.01], ['tipLen', 'Dark tip share', 0.05, 0.9, 0.01]];
const C = document.getElementById('ctl');
for (const [k, name, a, b, st] of DEF) { const l = document.createElement('label'); l.innerHTML = `<div class="row">${name}<span id="s_${k}">${P[k]}</span></div>`; const i = document.createElement('input'); i.type = 'range'; i.min = a; i.max = b; i.step = st; i.value = P[k]; i.oninput = () => { P[k] = +i.value; document.getElementById('s_' + k).textContent = P[k]; build(); }; l.appendChild(i); C.appendChild(l); }
const tcol = new THREE.MeshStandardMaterial({ color: '#b8401a', roughness: 0.6 }), legM = new THREE.MeshStandardMaterial({ color: '#c84a1c', roughness: 0.55 }), tipM = new THREE.MeshStandardMaterial({ color: '#2e1309', roughness: 0.5 });
let ring = null, sb = null, tail = new THREE.Group(); sc.add(tail);
new GLTFLoader().load('../assets/centi_seg.glb', g => { let m = null; g.scene.traverse(n => { if (n.isMesh && !m) m = n; }); const geo = m.geometry; geo.computeBoundingBox(); const bb = geo.boundingBox, D = bb.max.z - bb.min.z, k = 0.6 / D;
  const mat = new THREE.MeshStandardMaterial({ map: m.material.map, roughness: 0.6, color: new THREE.Color(0.6, 0.47, 0.6) });
  for (let i = 0; i < 3; i++) { const mm = new THREE.Mesh(geo, mat); mm.scale.setScalar(k); mm.position.set(0, -bb.min.y * k, -(bb.max.z + bb.min.z) / 2 * k + i * 0.46); sc.add(mm); if (i === 0) { ring = mm; mm.updateMatrixWorld(true); sb = new THREE.Box3().setFromObject(mm); } }
  build(); });
function build() { if (!sb) return; while (tail.children.length) tail.remove(tail.children[0]); const r = (sb.max.z - sb.min.z) / 2 * 0.95, cy = sb.max.y - r;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(r * P.capR, 24, 18), tcol); cap.scale.set(1, 1, P.capStretch); cap.position.set(0, cy + r * P.capY, sb.min.z + r * P.capZ); tail.add(cap);
  for (const s of [-1, 1]) { const g = new THREE.Group(); g.position.set(s * r * P.legX, cy + r * P.legY, sb.min.z - r * P.legZ); g.rotation.set(P.legDroop, s * P.legSpread, 0, 'YXZ'); tail.add(g);   /* each tail leg: two joints, pointing back (-z) */
    const L = r * P.legLen, l1 = L * (1 - P.tipLen), l2 = L * P.tipLen, th = r * P.legR;
    const a = new THREE.Mesh(new THREE.CylinderGeometry(th * 0.7, th, l1, 10), legM); a.rotation.x = -Math.PI / 2; a.position.z = -l1 / 2; g.add(a);
    const knee = new THREE.Group(); knee.position.z = -l1; knee.rotation.set(P.legBend, s * 0.15, 0); g.add(knee);
    const b = new THREE.Mesh(new THREE.ConeGeometry(th * 0.7, l2, 10), tipM); b.rotation.x = -Math.PI / 2; b.position.z = -l2 / 2; knee.add(b); }
  document.getElementById('out').value = 'centipede tail: ' + JSON.stringify(P); }
document.getElementById('copy').onclick = () => { const t = document.getElementById('out'); t.select(); navigator.clipboard?.writeText(t.value); document.getElementById('copy').textContent = 'Copied!'; setTimeout(() => document.getElementById('copy').textContent = 'Copy settings', 1200); };
(function loop() { requestAnimationFrame(loop); oc.update(); R.render(sc, cam); })();
</script></body></html>
